<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr_Expence</title>
    <link rel="stylesheet" href="/style/styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/Roundedfavicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/Roundedfavicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/Roundedfavicon/favicon-16x16.png">
    <link rel="manifest" href="/assets/Roundedfavicon/site.webmanifest">
</head>

<body>
    <main>
        <section class="container hero">
            <h1 class="display-l">
                Problem <br />
                <em>Picker</em>
            </h1>
            <p class="hero__lede body-l">
                Get a random Codeforces problem based on rating range.
            </p>

            <div class="picker">
                <div class="picker__field">
                    <label for="min-rating">Min</label>
                    <select id="min-rating" class="select">
                        <option value="800" selected>800</option>
                        <option value="900">900</option>
                        <option value="1000">1000</option>
                        <option value="1100">1100</option>
                        <option value="1200">1200</option>
                        <option value="1300">1300</option>
                        <option value="1400">1400</option>
                        <option value="1500">1500</option>
                        <option value="1600">1600</option>
                        <option value="1700">1700</option>
                        <option value="1800">1800</option>
                        <option value="1900">1900</option>
                        <option value="2000">2000</option>
                        <option value="2100">2100</option>
                        <option value="2200">2200</option>
                        <option value="2300">2300</option>
                        <option value="2400">2400</option>
                        <option value="2500">2500</option>
                        <option value="2600">2600</option>
                        <option value="2700">2700</option>
                        <option value="2800">2800</option>
                        <option value="2900">2900</option>
                        <option value="3000">3000</option>
                        <option value="3100">3100</option>
                        <option value="3200">3200</option>
                        <option value="3300">3300</option>
                        <option value="3400">3400</option>
                        <option value="3500">3500</option>
                    </select>
                </div>
                <div class="picker__field">
                    <label for="max-rating">Max</label>
                    <select id="max-rating" class="select">
                        <option value="800">800</option>
                        <option value="900">900</option>
                        <option value="1000">1000</option>
                        <option value="1100">1100</option>
                        <option value="1200">1200</option>
                        <option value="1300">1300</option>
                        <option value="1400">1400</option>
                        <option value="1500">1500</option>
                        <option value="1600">1600</option>
                        <option value="1700">1700</option>
                        <option value="1800">1800</option>
                        <option value="1900">1900</option>
                        <option value="2000">2000</option>
                        <option value="2100">2100</option>
                        <option value="2200">2200</option>
                        <option value="2300">2300</option>
                        <option value="2400">2400</option>
                        <option value="2500">2500</option>
                        <option value="2600">2600</option>
                        <option value="2700">2700</option>
                        <option value="2800">2800</option>
                        <option value="2900">2900</option>
                        <option value="3000">3000</option>
                        <option value="3100">3100</option>
                        <option value="3200">3200</option>
                        <option value="3300">3300</option>
                        <option value="3400">3400</option>
                        <option value="3500" selected>3500</option>
                    </select>
                </div>
                <button id="roll-btn" class="btn btn--filled"
                    onclick="roll(+document.getElementById('min-rating').value, +document.getElementById('max-rating').value)">
                    🎲 Random Problem
                </button>
            </div>
        </section>
    </main>

    <script src="/scripts/app.js"></script>
    <script src="/scripts/navbar.js"></script>
    <script src="/scripts/footer.js"></script>
</body>

</html>
