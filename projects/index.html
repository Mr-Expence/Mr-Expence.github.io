<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr_Expence</title>
  <link rel="stylesheet" href="/style/styles.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/Roundedfavicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/Roundedfavicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/Roundedfavicon/favicon-16x16.png">
  <link rel="manifest" href="/assets/Roundedfavicon/site.webmanifest">
</head>

<body>
  <main>
    <section class="container page-head">
      <h1 class="display-m">Projects</h1>
    </section>

    <section class="container section" style="padding-top:0;">
      <div class="chips" role="group" aria-label="Filter projects by category">
        <button class="chip is-active" data-filter-chip="all">All</button>
        <button class="chip" data-filter-chip="games">Games</button>
        <button class="chip" data-filter-chip="packs">Resource Packs</button>
        <button class="chip" data-filter-chip="tools">Tools</button>
      </div>
      <div class="grid" data-projects-grid>
        <div class="empty-state">Loading projects…</div>
      </div>
    </section>
  </main>

  <script src="/scripts/app.js"></script>
  <script src="/scripts/navbar.js"></script>
  <script src="/scripts/footer.js"></script>
</body>

</html>
